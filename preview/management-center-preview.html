 filter-select" aria-label="筛选维护人">${filterOpts(['周宁','李明','陈悦'],state.owner,'全部维护人')}</select><select id="filter-source" class="input filter-select" aria-label="筛选来源">${filterOpts(tags['来源渠道'],state.source,'全部来源')}</select></div>`:''}${actives.length?`<div class="filters-active row wrap"><span class="muted">已筛选</span>${actives.map(a=>`<button type="button" class="tag blue" data-action="remove-filter:${a[0]}">${esc(a[1])} ×</button>`).join('')}<button class="text-btn" data-action="clear-filters">清空筛选</button></div>`:''}${state.selected.size?`<div class="notice" style="margin:0 23px 16px;align-items:center"><span>已选 ${state.selected.size} 位创作者</span><span class="spacer"></span>${isAdmin()?btn('导出选中','export-selected','small'):''}${btn('取消选择','clear-selection','small ghost')}</div>`:''}<div class="table-wrap"><table style="min-width:930px"><thead><tr><th><input type="checkbox" id="select-all" aria-label="选择本页全部人员" ${pageData.length&&pageData.every(c=>state.selected.has(c.id))?'checked':''}></th><th>创作者</th><th>职业</th><th>擅长方向</th><th>城市</th><th>联系方式</th><th>维护人 / 更新日期</th><th>操作</th></tr></thead><tbody>${listRows(pageData)}</tbody></table></div>${!data.length?`<div class="empty">${icon('search')}<h3>${state.tab==='archived'?'暂无归档人员':'没有找到匹配的创作者'}</h3><p>${state.tab==='archived'?'归档后的人员仍可在这里查看和恢复。':'试试调整搜索关键词或筛选条件。'}</p>${btn('清空筛选','clear-filters')}</div>`:''}<div class="pagination"><span>共 ${data.length} 位创作者 ${data.length?`· 第 ${(state.page-1)*8+1}–${Math.min(state.page*8,data.length)} 位`:''}</span><div class="row" style="gap:7px"><span class="page-limit" style="margin-right:10px">每页 8 条</span><button class="page-num" data-action="page:${state.page-1}" ${state.page===1?'disabled':''} aria-label="上一页">‹</button>${Array.from({length:pageCount},(_,i)=>`<button class="page-num ${state.page===i+1?'active':''}" data-action="page:${i+1}" aria-label="第 ${i+1} 页" ${state.page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}<button class="page-num" data-action="page:${state.page+1}" ${state.page===pageCount?'disabled':''} aria-label="下一页">›</button></div></div></section>`;return shell(content,'创作者资源库')}
function kv(label,value,full=false){return `<div class="kv ${full?'full':''}"><label>${esc(label)}</label><div class="value">${value||'—'}</div></div>`}
function detailPage(c){if(!c)return missingPage();let info=`<section class="section"><h2 class="section-title">${icon('people')}基础资料</h2><div class="keyvals">${kv('姓名 / 昵称',esc(c.name))}${kv('所在城市',esc(c.city)||'未填写')}${kv('微信号',`${esc(c.wechat)||'未填写'} ${c.wechat?`<button class="icon-btn" data-action="copy:${c.id}" aria-label="复制微信号">${icon('copy')}</button>`:''}`)}${kv('手机号',esc(c.phone)||'未填写')}${kv('来源渠道',esc(c.source))}${kv('维护负责人',esc(c.owner))}${kv('个人简介',esc(c.intro)||'暂未填写',true)}</div></section><section class="section"><h2 class="section-title">${icon('briefcase')}职业与能力</h2><div class="keyvals">${kv('职业',`<div class="row-tags">${c.jobs.map(j=>tag(j,'blue')).join('')}</div>`)}${kv('擅长方向',`<div class="row-tags">${c.skills.map(s=>tag(s)).join('')}</div>`)}${kv(c.jobs.includes('编剧')?'剧本类型':'内容类型',c.jobs.includes('编剧')?'短剧、剧情短视频':'口播、广告短片')}${kv(c.jobs.includes('剪辑')?'使用软件':'创作方式',c.jobs.includes('剪辑')?'Premiere、DaVinci Resolve':'原创、改编')}</div></section><section class="section"><h2 class="section-title">${icon('film')}代表作品<span class="count-label">${c.works.length} 项</span></h2>${c.works.map((w,i)=>`<div class="work"><div class="work-cover">${icon(i?'file':'film')}</div><div class="spacer"><h3>${esc(w.name)}</h3><p>${esc(w.type)}<br>${esc(w.desc||'示例作品')}</p></div>${btn('查看作品','work:'+c.id+':'+i,'small ghost','external')}</div>`).join('')||'<p class="article">暂未添加代表作品。</p>'}</section><section class="section"><h2 class="section-title">${icon('note')}内部备注</h2><p class="article">${esc(c.notes)||'暂无备注'}</p></section>`;let history=`<section class="section"><h2 class="section-title">${icon('clock')}资料修改记录</h2><div class="timeline"><div class="timeline-item"><small>${c.updated} · ${esc(c.owner)}</small>更新了创作者资料。</div><div class="timeline-item"><small>${c.created} · ${esc(c.owner)}</small>创建创作者档案。</div></div></section>`;return shell(`<a class="back" href="#/creators">${icon('arrow')}返回创作者资源库</a>${c.archived?`<div class="notice warning archive-banner">${icon('archive')}这位创作者已归档，资料仍然保留。${isAdmin()?btn('恢复档案','restore:'+c.id,'small'):''}</div>`:''}<div class="detail-layout"><div class="panel"><div class="profile-head">${avatar(c.name,c.id)}<div class="spacer"><h1 class="profile-name">${esc(c.name)}</h1><div class="row" style="gap:7px">${c.jobs.map(j=>tag(j,'blue')).join('')}<span class="tiny muted">${esc(c.city)}</span></div><div class="profile-meta row"><span>档案编号 CR-${String(c.id).padStart(4,'0')}</span><span>最近更新 ${c.updated}</span></div></div>${btn('编辑资料','edit:'+c.id,'','edit')}</div><div class="tabs record-tabs"><button class="tab ${state.detailTab==='info'?'active':''}" data-action="detail-tab:info">人员档案</button><button class="tab ${state.detailTab==='history'?'active':''}" data-action="detail-tab:history">修改记录</button></div>${state.detailTab==='history'?history:info}</div><aside class="detail-aside"><section class="side-card"><h3>资料维护</h3>${kv('维护负责人',`<span class="row" style="gap:8px">${avatar(c.owner)}${esc(c.owner)}</span>`)}${kv('录入时间',c.created)}${kv('最近更新时间',c.updated)}</section><section class="side-card"><h3>参考报价</h3><div class="amount" style="font-size:25px;margin-bottom:8px;color:#405875">${c.quote?'¥ '+esc(c.quote):'未填写'}<span style="font-size:11px;color:#8b99ad">${c.quote?' / '+esc(c.unit):''}</span></div></section><section class="side-card"><h3>档案操作</h3><div class="stack" style="gap:9px">${btn('复制档案摘要','copy-summary:'+c.id,'','copy')}${isAdmin()?btn(c.archived?'恢复档案':'归档创作者',(c.archived?'restore:':'archive:')+c.id,'ghost',c.archived?'refresh':'archive'):''}</div></section></aside></div>`,'创作者详情')}
function textField(label,name,value='',placeholder='',required=false,type='text',full=false){return `<div class="field ${full?'full':''}"><label for="field-${name}">${esc(label)}${required?'<span class="required">*</span>':''}</label><input class="input" id="field-${name}" name="${name}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}" ${required?'required':''}></div>`}
function selectField(label,name,values,value='',placeholder='请选择'){return `<div class="field"><label for="field-${name}">${esc(label)}</label><select class="input" id="field-${name}" name="${name}"><option value="">${placeholder}</option>${values.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}
function formPage(c){let editing=!!c;let v=c||{name:'',jobs:[],skills:[],city:'',wechat:'',phone:'',source:'',owner:'李明',intro:'',quote:'',unit:'条',notes:'',works:[]};formWorks=v.works.map(w=>({...w}));return shell(`<a href="#${editing?'/creators/'+c.id:'/creators'}" class="back">${icon('arrow')}${editing?'返回创作者详情':'返回创作者资源库'}</a>${heading(editing?'编辑创作者':'新增创作者',editing?'更新人员资料，持续完善创作者档案。':'先登记基本资料，更多信息可以在后续维护中补充。')}<div class="form-layout"><form id="creator-form" class="panel" novalidate data-edit-id="${editing?c.id:''}"><div id="form-errors"></div><section class="section" id="basic-section"><h2 class="section-title">${icon('people')}基础资料</h2><div class="form-grid">${textField('姓名 / 昵称','name',v.name,'请输入姓名或常用昵称',true)}${selectField('所在城市','city',['北京','上海','杭州','广州','深圳','成都','武汉','南京'],v.city)}${textField('微信号','wechat',v.wechat,'请输入微信号')}${textField('手机号','phone',v.phone,'请输入手机号（选填）')}${selectField('来源渠道','source',tags['来源渠道'],v.source)}${selectField('维护负责人','owner',['李明','周宁','陈悦'],v.owner)}<div class="field full"><label for="field-intro">个人简介</label><textarea class="input" name="intro" id="field-intro" placeholder="简要介绍创作者的经历、能力或特点">${esc(v.intro)}</textarea></div></div></section><section class="section" id="skill-section"><h2 class="section-title">${icon('briefcase')}职业与能力</h2><div class="form-grid"><div class="field full"><label>职业类型<span class="required">*</span></label><div class="check-group" id="job-options">${occupations.map(j=>`<label class="check-chip"><input type="checkbox" name="jobs" value="${esc(j[0])}" ${v.jobs.includes(j[0])?'checked':''}>${esc(j[0])}</label>`).join('')}</div></div>${textField('擅长方向','skills',v.skills.join('、'),'例如：都市情感、悬疑、短剧',false,'text',true)}<div class="field full" id="job-specific">${jobSpecific(v.jobs)}</div></div></section><section class="section" id="works-section"><h2 class="section-title">${icon('film')}代表作品</h2><div id="form-works">${formWorksHtml()}</div>${btn('添加一条作品','add-work','small','plus')}</section><section class="section" id="extra-section"><h2 class="section-title">${icon('note')}补充信息</h2><div class="form-grid">${textField('参考报价','quote',v.quote,'请输入金额',false,'number')}${selectField('计价单位','unit',['条','集','分钟','天','项目'],v.unit,'请选择计价单位')}<div class="field full"><label for="field-notes">内部备注</label><textarea class="input" name="notes" id="field-notes" placeholder="仅供内部运营参考的补充信息">${esc(v.notes)}</textarea></div></div></section><footer class="form-footer"><span class="checkbox-note">* 为必填项</span><div class="row" style="gap:9px">${btn('取消','cancel-form')}<button type="submit" class="btn primary">${icon('check')}${editing?'保存修改':'保存创作者'}</button></div></footer></form><aside><div class="side-card form-section-nav"><h3 style="margin-bottom:12px">资料分组</h3><a href="#basic-section" data-scroll="basic-section">01　基础资料</a><a href="#skill-section" data-scroll="skill-section">02　职业与能力</a><a href="#works-section" data-scroll="works-section">03　代表作品</a><a href="#extra-section" data-scroll="extra-section">04　补充信息</a></div></aside></div>`,editing?'编辑创作者':'新增创作者')}
function jobSpecific(jobs){if(!jobs.length)return '<div class="notice neutral">'+icon('info')+'选择职业后，显示对应的专业信息。</div>';return `<div class="notice neutral">${icon('info')}<span>${jobs.includes('编剧')?'编剧可补充擅长题材、剧本类型与创作方式。 ':''}${jobs.includes('剪辑')?'剪辑可补充使用软件、视频类型与专业能力。':''}${!jobs.includes('编剧')&&!jobs.includes('剪辑')?'职业专属信息可在职业分类中配置。':''}</span></div>`}
function formWorksHtml(){return formWorks.map((w,i)=>`<div class="work" data-work-index="${i}" style="margin-bottom:15px;align-items:flex-start"><div class="work-cover" style="width:42px;height:42px">${icon('file')}</div><div class="stack spacer" style="gap:9px"><input class="input" aria-label="作品 ${i+1} 名称" data-work-name="${i}" value="${esc(w.name)}" placeholder="作品名称"><input class="input" type="url" aria-label="作品 ${i+1} 链接" data-work-url="${i}" value="${esc(w.url||'')}" placeholder="作品链接，例如 https://example.com/work"></div><button class="icon-btn" type="button" data-action="remove-work:${i}" aria-label="移除作品 ${i+1}">${icon('close')}</button></div>`).join('')}
function occupationsPage(){let job=state.occupation;let fields=fieldsByJob[job]||[['专业方向','多选标签','按实际业务补充'],['使用工具','文本','可选填']];return shell(`${heading('职业分类','统一职业名称，并按职业维护专属资料字段。',btn('新增职业','add-occupation','primary','plus'))}<div class="config-layout"><div class="panel"><div class="panel-heading"><h3 style="font-size:13px">职业类型 <span class="count-label">${occupations.length}</span></h3></div><div class="config-list">${occupations.map(j=>`<button type="button" class="config-item ${job===j[0]?'active':''}" data-action="occupation:${esc(j[0])}"><span class="row" style="gap:9px">${icon(j[2])}${esc(j[0])}</span><small>${creators.filter(c=>c.jobs.includes(j[0])&&!c.archived).length} 人</small></button>`).join('')}</div></div><section class="panel"><div class="panel-heading"><div><h2>${esc(job)}</h2><p>${esc(occupations.find(j=>j[0]===job)?.[1]||'职业资料')}</p></div>${tag('启用中','green')}</div><div class="panel-heading"><h3 style="font-size:13px">职业专属字段</h3>${btn('添加字段','add-field','small','plus')}</div><div class="table-wrap"><table><thead><tr><th>字段名称</th><th>字段类型</th><th>选项 / 说明</th><th>操作</th></tr></thead><tbody>${fields.map((f,i)=>`<tr><td>${esc(f[0])}</td><td><span class="field-type">${esc(f[1])}</span></td><td style="font-size:11px;max-width:250px;line-height:1.8">${esc(f[2])}</td><td><button class="text-btn" data-action="edit-field:${i}">编辑</button></td></tr>`).join('')}</tbody></table></div><div class="pagination"><span></span><span>共 ${fields.length} 个专属字段</span></div></section></div>`,'职业分类')}
function tagsPage(){return shell(`${heading('技能标签','统一标签口径，让创作者资料更易查询和维护。',btn('新增标签','add-tag','primary','plus'))}<div class="config-layout"><aside class="panel"><div class="panel-heading"><h3 style="font-size:13px">标签分类</h3></div><div class="config-list">${Object.keys(tags).map(g=>`<button class="config-item ${state.tagGroup===g?'active':''}" data-action="tag-group:${g}"><span>${esc(g)}</span><small>${tags[g].length}</small></button>`).join('')}</div></aside><section class="panel"><div class="panel-heading"><div><h2>${esc(state.tagGroup)}</h2></div><span class="tiny muted">${tags[state.tagGroup].length} 个标签</span></div><div class="tag-cloud">${tags[state.tagGroup].map((t,i)=>`<div class="tag-card"><span>${esc(t)}</span><small>${creators.filter(c=>c.skills.includes(t)||c.source===t).length} 人</small><button class="icon-btn" style="width:23px;height:23px" data-action="edit-tag:${i}" aria-label="编辑${esc(t)}">${icon('edit')}</button></div>`).join('')}</div></section></div>`,'技能标签')}
function membersPage(){return shell(`${heading('内部成员','关联飞书员工身份，管理内部成员的访问状态。',btn('添加成员','add-member','primary','plus'),'信计 X 平台')}<section class="panel"><div class="toolbar"><div class="search">${icon('search')}<input id="member-search" class="input" placeholder="搜索成员姓名、邮箱或部门" aria-label="搜索内部成员"></div><span class="spacer"></span><span class="filter-hint">${members.length} 位成员</span></div><div class="table-wrap"><table style="min-width:720px"><thead><tr><th>成员</th><th>部门</th><th>飞书身份</th><th>平台状态</th><th>操作</th></tr></thead><tbody id="member-rows">${memberRows(members)}</tbody></table></div><div class="pagination"><span></span><span>共 ${members.length} 位成员</span></div></section>`,'内部成员',true)}
function memberRows(list){return list.map((m,i)=>`<tr><td><div class="person">${avatar(m.name,i)}<span><strong>${esc(m.name)}</strong><small>${esc(m.email)}</small></span></div></td><td>${esc(m.dept)}</td><td>${tag('已关联','blue')}</td><td><span class="status-dot ${!m.status?'off':''}"></span>${m.status?'启用':'停用'}</td><td><div class="table-actions"><button class="text-btn" data-action="member-grant:${esc(m.name)}">授权</button><button class="text-btn" data-action="toggle-member:${members.indexOf(m)}">${m.status?'停用':'启用'}</button></div></td></tr>`).join('')}
