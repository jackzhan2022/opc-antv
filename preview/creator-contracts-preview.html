<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light">
<title>创作者合同 · 独立界面预览</title>
<style>
:root{--blue:#2563eb;--ink:#172b4d;--muted:#63758b;--line:#e3e9f1;--bg:#f6f8fc;--soft:#edf3ff;font:14px/1.6 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit}button:disabled{cursor:not-allowed;opacity:.5}a{color:var(--blue);text-decoration:none}h1,h2,h3,p{margin:0}h1{font-size:26px;letter-spacing:-.6px}h2{font-size:18px}h3{font-size:15px}small,.muted{color:var(--muted)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #93b8ff;outline-offset:3px}.preview-bar{background:#eaf1fc;color:#36547c;min-height:36px;padding:7px 24px;display:flex;justify-content:space-between;gap:12px;font-size:12px;border-bottom:1px solid #d8e4f5;position:sticky;top:0;z-index:30}.preview-bar strong{font-weight:600}.sidebar{position:fixed;top:36px;bottom:0;width:216px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 15px;z-index:20}.brand{display:flex;gap:12px;align-items:center;padding:0 12px 32px}.logo{display:grid;place-items:center;width:34px;height:34px;background:var(--blue);color:white;border-radius:9px}.brand strong{font-size:17px}.brand small{display:block;font-size:9px;letter-spacing:1.7px;color:#6b87ba}.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.nav-label{padding:15px 14px 8px;color:#7f8da3;font-size:11px}.nav-item{width:100%;border:0;border-radius:7px;display:flex;align-items:center;gap:12px;background:transparent;padding:12px 14px;margin:3px 0;text-align:left;color:#526782}.nav-item:hover{background:#f6f8fc}.nav-item.active{color:var(--blue);background:var(--soft);font-weight:600}.nav-item.active:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--blue);margin-left:auto}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:18px 12px 0;font-size:12px;color:var(--muted)}.shell{margin-left:216px}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);padding:0 32px;display:flex;justify-content:space-between;align-items:center;gap:12px}.crumb{font-size:12px;color:var(--muted)}.crumb span{margin:0 12px;color:#b6c2d2}.persona{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{width:36px;height:36px;background:#edf3ff;color:#4168b1;border-radius:10px;display:grid;place-items:center;flex-shrink:0}.persona small{font-size:11px;display:block}.main{max-width:1640px;margin:auto;padding:30px 32px}.heading{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.heading p{color:var(--muted);margin-top:7px;font-size:13px}.btn{border:1px solid #dce4ef;border-radius:6px;background:white;padding:8px 14px;min-height:36px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}.btn:hover{background:#f5f8ff;border-color:#b9c9e2}.btn:active{background:#e8effd}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1d4ed8}.btn.small{padding:5px 9px;min-height:30px;font-size:12px}.text-btn{border:0;background:transparent;color:var(--blue);padding:5px 0;text-align:left;font-size:13px}.text-btn:hover{text-decoration:underline}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);padding:0 22px}.tab{background:none;border:0;padding:16px 0 13px;color:var(--muted);border-bottom:2px solid transparent;font-size:13px;white-space:nowrap}.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}.count{font-size:11px;margin-left:7px;padding:1px 6px;border-radius:4px;background:#f0f3f8}.active .count{background:#eaf1ff}.toolbar{padding:20px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.search{min-width:200px;max-width:350px;flex:1}.input{width:100%;min-height:38px;padding:8px 11px;border:1px solid #dce4ef;border-radius:6px;background:#fff;color:var(--ink)}.input::placeholder{color:#8d9bae}.input:focus{border-color:var(--blue)}.input.select{width:auto;min-width:135px}.push{margin-left:auto}.notice{padding:13px 16px;border:1px solid #dbe7fa;border-radius:7px;background:#f1f6ff;color:#44618a;margin:0 22px 20px;font-size:12px;line-height:1.8}.notice.amber{background:#fff9e9;border-color:#f1dfae;color:#89621a}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:13px;min-width:990px}th{background:#f8fafc;font-size:12px;color:#65768d;font-weight:500;white-space:nowrap;border-top:1px solid var(--line);height:44px}td,th{padding:16px 18px;border-bottom:1px solid #ecf0f5}td:first-child,th:first-child{padding-left:22px}td{height:84px}tbody tr:hover{background:#fbfcff}.title{font-size:13px;font-weight:600}.sub{display:block;font-size:11px;color:var(--muted);margin-top:5px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tag{display:inline-flex;padding:3px 8px;background:#f0f3f7;border-radius:4px;font-size:11px;white-space:nowrap;color:#5b6c82}.tag.blue{color:#295cae;background:#edf3ff}.tag.green{color:#237053;background:#edf8f2}.tag.amber{color:#8f651c;background:#fff6e6}.tag.red{color:#a13d48;background:#fff0f1}.pagination{padding:17px 22px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.page-current{width:30px;height:30px;border:1px solid #b9cef5;border-radius:5px;background:#eff5ff;color:var(--blue);display:grid;place-items:center}.help{color:var(--muted);font-size:12px;line-height:1.9;margin-top:24px}.help strong{color:#425975}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px}.step{display:flex;gap:13px;align-items:flex-start;background:#fff;padding:20px;border:1px solid var(--line);border-radius:9px}.step-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eff4ff;color:var(--blue);flex-shrink:0;font-size:12px}.step h3{font-size:14px;margin-bottom:5px}.step p{font-size:12px;color:var(--muted)}.profile{display:flex;align-items:center;gap:16px;padding:25px 24px}.profile .avatar{width:56px;height:56px;border-radius:13px;font-size:18px}.profile h2{font-size:22px}.profile p{font-size:12px;color:var(--muted);margin-top:5px}.back{display:inline-flex;border:0;background:none;color:var(--blue);font-size:12px;padding:0;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.person-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}.person-card h2{font-size:17px;margin:14px 0 5px}.person-card p{font-size:12px;color:var(--muted);margin-bottom:22px}.empty{text-align:center;padding:65px 20px;color:var(--muted)}.empty svg{width:42px;height:42px;margin-bottom:12px;color:#adbbce}.empty h3{color:#65778e;margin-bottom:6px}.footer{margin-top:24px;font-size:11px;color:#7a899e;display:flex;justify-content:space-between;gap:15px}dialog{border:0;border-radius:12px;padding:0;width:min(680px,calc(100vw - 32px));max-height:calc(100dvh - 48px);box-shadow:0 20px 80px #172b4d38;color:var(--ink)}dialog::backdrop{background:#14233c70}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:18px}.close{border:0;background:transparent;min-width:36px;min-height:36px;color:var(--muted);font-size:23px}.dialog-body{padding:22px 24px;overflow-y:auto;max-height:calc(100dvh - 190px)}.dialog-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.field{margin-bottom:19px}.field label{display:block;font-size:13px;font-weight:500;margin-bottom:7px}.field small{display:block;font-size:11px;margin-top:5px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field .required{color:#c43f47;margin-right:4px}textarea.input{min-height:88px;resize:vertical}.check{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:#526782;line-height:1.8;margin:18px 0}.check input{accent-color:var(--blue);width:16px;height:16px;flex-shrink:0;margin-top:4px}.dialog-body .notice{margin:0 0 20px}.summary{display:grid;grid-template-columns:120px 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);margin-bottom:22px;font-size:13px}.summary dt,.summary dd{margin:0;padding:11px 13px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);overflow-wrap:anywhere}.summary dt{background:#f8fafc;color:var(--muted)}.audit{list-style:none;padding:0;margin:10px 0 0}.audit li{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;font-size:12px}.audit span{color:var(--muted)}.paper{background:#fff;border:1px solid #dce3ed;max-width:480px;margin:0 auto;padding:38px 35px;box-shadow:0 2px 15px #203c640b;min-height:480px;font-size:12px;line-height:2.1}.paper h3{text-align:center;font-size:20px;letter-spacing:2px;margin-bottom:25px}.paper .blank{display:inline-block;min-width:90px;border-bottom:1px solid #6b7c94;color:#315b9c;text-align:center}.paper .signatures{display:flex;gap:25px;justify-content:space-between;margin-top:45px}.paper small{display:block;text-align:center;font-size:10px;margin-top:50px}.editor-placeholder{border:1px dashed #adc4ec;border-radius:8px;background:#f5f8ff;padding:28px;text-align:center;line-height:1.9;margin-bottom:22px}.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);padding:12px 22px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 28px #172b4d25;z-index:100;max-width:calc(100vw - 32px);font-size:13px}.mobile-menu{display:none}.mobile-overlay{display:none}
@media(max-width:1050px){.main{padding:26px 22px}.topbar{padding:0 22px}.steps{gap:12px}.step{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.preview-bar{height:72px;padding:8px 16px;font-size:11px;align-items:flex-start;justify-content:center;flex-direction:column;gap:3px}.preview-extra{display:none}.sidebar{transform:translateX(-100%);top:72px}.sidebar.open{transform:translateX(0)}.mobile-overlay.show{display:block;position:fixed;inset:72px 0 0;background:#14233c65;z-index:19;border:0;width:100%}.shell{margin-left:0}.mobile-menu{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;border:0;background:none;margin-left:-7px}.topbar{height:60px;padding:0 18px}.persona .avatar{display:none}.main{padding:24px 16px}.heading{align-items:flex-start;flex-direction:column;gap:16px}.heading h1{font-size:24px}.heading .btn{min-height:44px}.steps{grid-template-columns:1fr}.step{padding:16px}.toolbar{padding:18px;gap:10px}.toolbar .search{max-width:none;min-width:100%;flex-basis:100%}.toolbar .push{margin-left:0}.notice{margin:0 18px 18px}.tabs{padding:0 18px;gap:20px;overflow-x:auto}.pagination{padding:16px 18px}.grid{grid-template-columns:1fr}.profile{padding:22px 18px;gap:12px}.profile h2{font-size:19px}.field-grid{grid-template-columns:1fr;gap:0}.dialog-head,.dialog-body{padding:18px}.dialog-foot{padding:14px 18px}.dialog-foot .btn{min-height:44px}.summary{grid-template-columns:94px 1fr;font-size:12px}.footer{flex-direction:column;gap:5px}.paper{padding:30px 22px}.btn.small{min-height:38px}.toast{bottom:16px}.persona small{font-size:10px}.close{min-width:44px;min-height:44px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="preview-bar"><strong>界面预览 · 示例数据</strong><span>操作仅在当前页面生效，不上传文件、不执行签署<span class="preview-extra"> · 刷新可重置</span></span></div>
<button class="mobile-overlay" id="overlay" aria-label="关闭导航"></button>
<aside class="sidebar" id="sidebar"><div class="brand"><span class="logo" id="brand-icon"></span><div><strong>创作者管理</strong><small>CREATOR HUB</small></div></div><nav aria-label="业务导航"><div class="nav-label">资源管理</div><button class="nav-item" data-nav="creators" id="nav-creators"></button><button class="nav-item" data-nav="contracts" id="nav-contracts"></button><button class="nav-item" data-nav="templates" id="nav-templates"></button></nav><div class="sidebar-foot">独立交互原型<br><span>用于查看合同页面与操作流程</span></div></aside>
<div class="shell"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" id="menu" aria-label="打开业务导航"></button><div class="crumb">创作者管理 <span>/</span><strong id="crumb">合同管理</strong></div></div><div class="persona"><span class="avatar">预览</span><div>管理员视图<small>示例身份</small></div></div></header><main class="main" id="main"></main></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
const icons={people:'<circle cx="9" cy="7" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M21 20v-3a6 6 0 0 0-3-5"/>',contract:'<path d="M7 3h7l4 4v14H5V3h2M14 3v5h4M8 12h7M8 16h5"/>',template:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h3M15 15h1M8 18h3"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',empty:'<path d="m3 9 5-6h8l5 6v11H3V9ZM3 10h5l2 3h4l2-3h5"/>'};
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
const esc=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#brand-icon').innerHTML=icon('people');document.querySelector('#menu').innerHTML=icon('menu');
for(const [id,label,i] of [['creators','创作者资源库','people'],['contracts','合同管理','contract'],['templates','合同模板','template']])document.querySelector('#nav-'+id).innerHTML=icon(i)+`<span>${label}</span>`;
const creators=[{id:'c1',name:'林知夏',job:'编剧',city:'杭州',phone:'13800000001'},{id:'c2',name:'周予安',job:'剪辑',city:'上海',phone:'13800000002'},{id:'c3',name:'陈亦',job:'导演',city:'北京',phone:'13800000003'}];
let templates=[{id:'t1',name:'编剧创作合作协议',file:'编剧创作合作协议.docx',type:'Word',ready:true,date:'2026/11/14',fields:['合作金额','交付内容','交付日期']},{id:'t2',name:'剪辑制作服务协议',file:'剪辑制作服务协议.pdf',type:'PDF',ready:true,date:'2026/11/14',fields:['合作金额','交付内容','交付日期']},{id:'t3',name:'保密与知识产权协议',file:'保密协议.docx',type:'Word',ready:false,date:'2026/11/14',fields:['合作金额','交付内容','交付日期']}];
let contracts=[{id:'CT-20261114-001',creator:'c1',template:'t1',title:'短剧《秋日来信》编剧合作协议',state:'SIGNED',amount:'12,000.00',delivery:'完成前 12 集剧本及一轮修改',deadline:'2026-12-14',date:'2026/11/14 10:30',archived:true},{id:'CT-20261114-002',creator:'c2',template:'t2',title:'品牌短片后期剪辑服务协议',state:'SIGNING',amount:'6,000.00',delivery:'交付 3 分钟成片及字幕文件',deadline:'2026-12-14',date:'2026/11/14 11:20',archived:false},{id:'CT-20261114-003',creator:'c1',template:'t3',title:'创作项目保密协议',state:'DRAFT',amount:'—',delivery:'保密与知识产权约定',deadline:'2026-12-14',date:'2026/11/14 14:00',archived:false}];
const states={DRAFT:['草稿',''],PREPARING:['正在生成','blue'],SIGNING:['签署中','blue'],SIGNED:['已签署','green'],CANCELLED:['已撤销','red']};
let activeTab='ALL',query='',templateQuery='',toastTimer;
const dialog=document.querySelector('#dialog'), main=document.querySelector('#main');
function toast(text){const e=document.querySelector('#toast');e.textContent=text;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,3200)}
function closeNav(){document.querySelector('#sidebar').classList.remove('open');document.querySelector('#overlay').classList.remove('show');document.querySelector('#menu').setAttribute('aria-expanded','false')}
document.querySelector('#menu').onclick=()=>{const open=document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#overlay').classList.toggle('show',open);document.querySelector('#menu').setAttribute('aria-expanded',String(open))};document.querySelector('#overlay').onclick=closeNav;
function navigate(page){location.hash=page;closeNav()}
document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>navigate(e.dataset.nav));
const button=(label,action,id,primary=false)=>`<button class="btn small${primary?' primary':''}" data-action="${action}" data-id="${esc(id)}">${label}</button>`;
const footer=()=>`<footer class="footer"><span>创作者平台 · 合同管理</span><span>本页所有人物、合同与状态均为示例</span></footer>`;
function empty(message){return `<div class="empty">${icon('empty')}<h3>${message}</h3><p>可切换筛选条件或体验拟定合同</p></div>`}
function contractTable(items){return items.length?`<div class="table-wrap"><table><thead><tr><th>合同名称</th><th>创作者</th><th>状态</th><th>签署截止</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${items.map(c=>{const p=creators.find(x=>x.id===c.creator),t=templates.find(x=>x.id===c.template),s=states[c.state];return `<tr><td style="min-width:250px"><button class="text-btn title" data-action="detail" data-id="${c.id}">${esc(c.title)}</button><span class="sub">${esc(t?.name||'原模板')} · 示例</span></td><td><button class="text-btn" data-action="creator" data-id="${p.id}">${esc(p.name)}</button><span class="sub">${p.job}</span></td><td><span class="tag ${s[1]}">${s[0]}</span></td><td>${esc(c.deadline)}</td><td>${esc(c.date)}</td><td style="min-width:290px"><div class="actions">${button('详情','detail',c.id)}${c.state==='DRAFT'?button('预览草稿','paper',c.id)+button('发起签署','launch',c.id,true):c.state==='SIGNING'?button('签署链接','sign',c.id)+button('同步状态','sync',c.id):c.state==='SIGNED'?button(c.archived?'查看归档说明':'归档签署文件','archive',c.id):''}</div></td></tr>`}).join('')}</tbody></table></div>`:empty('暂无符合条件的合同')}
function contractsPage(person){const items=contracts.filter(c=>(!person||c.creator===person.id)&&(activeTab==='ALL'||c.state===activeTab)&&(!query||c.title.includes(query)||creators.find(p=>p.id===c.creator).name.includes(query)));
return `${person?`<button class="back" data-action="nav" data-id="creators">← 返回创作者资源库</button><section class="panel" style="margin-bottom:24px"><div class="profile"><span class="avatar">${esc(person.name.slice(-2))}</span><div><h2>${esc(person.name)} <span class="tag">示例档案</span></h2><p>${person.job} · ${person.city} · 手机 ${person.phone.slice(0,3)}****${person.phone.slice(-4)}</p></div><button class="btn primary push" data-action="draft" data-id="${person.id}">${icon('plus')}拟定合同</button></div><div class="tabs"><button class="tab" data-action="profile" data-id="${person.id}">人员档案</button><button class="tab active">合同记录 <span class="count">${contracts.filter(c=>c.creator===person.id).length}</span></button></div></section>`:`<div class="heading"><div><h1>合同管理</h1><p>与创作者的合作合同和签署记录</p></div><button class="btn primary" data-action="draft" data-id="">${icon('plus')}拟定合同</button></div>`}
<section class="panel">${!person?`<div class="tabs">${[['ALL','全部合同'],['DRAFT','草稿'],['SIGNING','签署中'],['SIGNED','已签署']].map(([key,label])=>`<button class="tab ${key===activeTab?'active':''}" data-action="tab" data-id="${key}">${label}<span class="count">${contracts.filter(c=>key==='ALL'||c.state===key).length}</span></button>`).join('')}</div>`:''}<form class="toolbar" id="search-form"><input aria-label="搜索合同" class="input search" name="q" placeholder="搜索合同名称、创作者" value="${esc(query)}"><button class="btn" type="submit">搜索</button><button class="btn" type="button" data-action="reset">重置</button><span class="muted push" style="font-size:12px">${person?'每次签约独立留存':'示例合同，公司共享'}</span></form>${contractTable(items)}<div class="pagination"><span>共 ${items.length} 份${person?'':'示例'}合同</span><span class="page-current">1</span></div></section><div class="help"><strong>签约流程</strong><p>选择创作者和模板 → 核对实名与填写内容 → 预览合同 → 管理员确认发起 → 同步状态与归档。</p></div>${footer()}`}
function templatesPage(){const items=templates.filter(t=>!templateQuery||t.name.includes(templateQuery));return `<div class="heading"><div><h1>合同模板</h1><p>导入原文件，配置填写字段和签署位置后重复使用</p></div><button class="btn primary" data-action="import">${icon('plus')}导入模板</button></div><div class="steps"><section class="step"><span class="step-num">1</span><div><h3>导入 Word / PDF</h3><p>保留原文件，Word 转换后核对版式</p></div></section><section class="step"><span class="step-num">2</span><div><h3>配置签约模板</h3><p>设置公司与创作者、填写字段及签章位置</p></div></section><section class="step"><span class="step-num">3</span><div><h3>发布并关联</h3><p>校验模板编号，启用后用于拟定合同</p></div></section></div><section class="panel"><form class="toolbar" id="template-search"><input class="input search" name="q" aria-label="搜索模板" value="${esc(templateQuery)}" placeholder="搜索模板名称"><button class="btn" type="submit">搜索</button><span class="muted push" style="font-size:12px">示例模板库</span></form><div class="table-wrap"><table><thead><tr><th>模板名称</th><th>格式</th><th>状态</th><th>导入日期</th><th>操作</th></tr></thead><tbody>${items.map(t=>`<tr><td><strong class="title">${esc(t.name)}</strong><span class="sub">${esc(t.file)}</span></td><td>${t.type}</td><td><span class="tag ${t.ready?'green':'amber'}">${t.ready?'可用于签约':'待配置'}</span></td><td>${t.date}</td><td><div class="actions">${button('原文件','source',t.id)}${button('配置模板','configure',t.id)}${button('关联模板','bind',t.id)}${t.ready?button('停用','disable',t.id):''}</div></td></tr>`).join('')}</tbody></table></div><div class="pagination"><span>共 ${items.length} 份示例模板</span><span class="page-current">1</span></div></section><div class="help"><strong>关于模板导入</strong><p>支持 .doc、.docx、.pdf，单个文件不超过 5MB。导入文件后仍需配置填写字段和签章位置；Word 占位符或扫描 PDF 不会自动变成可签署模板。</p></div>${footer()}`}
function creatorsPage(){return `<div class="heading"><div><h1>创作者资源库</h1><p>选择一位示例创作者，查看合同记录并体验拟定流程</p></div></div><div class="grid">${creators.map(p=>`<article class="person-card"><span class="avatar">${esc(p.name.slice(-2))}</span><h2>${esc(p.name)} <span class="tag">示例</span></h2><p>${p.job} · ${p.city}<br>关联合同 ${contracts.filter(c=>c.creator===p.id).length} 份</p><button class="btn" data-action="creator" data-id="${p.id}">查看合同记录 →</button></article>`).join('')}</div>${footer()}`}
function render(){const route=location.hash.slice(1)||'contracts',person=route.startsWith('creator-')?creators.find(p=>p.id===route.slice(8)):null;const page=person?'creators':route;document.querySelectorAll('[data-nav]').forEach(e=>{e.classList.toggle('active',e.dataset.nav===page);e.setAttribute('aria-current',e.dataset.nav===page?'page':'false')});document.querySelector('#crumb').textContent=person?'创作者合同记录':page==='templates'?'合同模板':page==='creators'?'创作者资源库':'合同管理';main.innerHTML=person?contractsPage(person):page==='templates'?templatesPage():page==='creators'?creatorsPage():contractsPage();const search=document.querySelector('#search-form');if(search)search.onsubmit=e=>{e.preventDefault();query=new FormData(search).get('q').trim();render()};const templateSearch=document.querySelector('#template-search');if(templateSearch)templateSearch.onsubmit=e=>{e.preventDefault();templateQuery=new FormData(templateSearch).get('q').trim();render()}}
function openDialog(title,body,foot='',wide=false){dialog.style.width=wide?'min(860px,calc(100vw - 32px))':'';dialog.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="close" data-close aria-label="关闭弹窗">×</button></div><div class="dialog-body">${body}</div><div class="dialog-foot"><button class="btn" data-close>关闭</button>${foot}</div>`;if(!dialog.open)dialog.showModal()}
function showDraft(creatorId){const ready=templates.filter(t=>t.ready);if(!ready.length){openDialog('暂无可用模板','请先在合同模板中导入并配置一份模板。');return}openDialog('拟定创作者合同',`<div class="notice">界面体验：保存的草稿只在本页展示，不写入正式系统。</div><form id="draft-form"><div class="field"><label for="draft-creator"><span class="required">*</span>创作者</label><select id="draft-creator" class="input" name="creator" required>${creators.map(p=>`<option value="${p.id}" ${p.id===creatorId?'selected':''}>${esc(p.name)}（示例） · ${p.job}</option>`).join('')}</select></div><div class="field"><label for="draft-template"><span class="required">*</span>合同模板</label><select id="draft-template" class="input" name="template" required>${ready.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label for="draft-title"><span class="required">*</span>合同名称</label><input id="draft-title" class="input" name="title" required maxlength="200" value="${esc((creators.find(p=>p.id===creatorId)||creators[0]).name)}合作合同"></div><div class="field-grid"><div class="field"><label for="draft-name"><span class="required">*</span>创作者签约实名姓名</label><input id="draft-name" class="input" name="legalName" required value="${esc((creators.find(p=>p.id===creatorId)||creators[0]).name)}"><small>档案可能使用昵称，请核对真实姓名</small></div><div class="field"><label for="draft-phone"><span class="required">*</span>签署手机号</label><input id="draft-phone" class="input" name="mobile" inputmode="tel" pattern="1[3-9][0-9]{9}" required value="${(creators.find(p=>p.id===creatorId)||creators[0]).phone}"></div></div><div class="field-grid"><div class="field"><label for="draft-amount"><span class="required">*</span>合作金额（元）</label><input id="draft-amount" class="input" name="amount" type="number" min="0" step="0.01" placeholder="请输入本次合同金额" required></div><div class="field"><label for="draft-date"><span class="required">*</span>签署截止日期</label><input id="draft-date" class="input" type="date" name="deadline" required value="2026-12-14"></div></div><div class="field"><label for="draft-delivery"><span class="required">*</span>交付内容</label><textarea id="draft-delivery" class="input" name="delivery" required maxlength="10000" placeholder="填写交付内容与要求"></textarea></div><label class="check"><input type="checkbox" required>已核对签约实名姓名、手机号和填写内容</label></form>`,`<button class="btn primary" type="submit" form="draft-form">保存示例草稿</button>`);const form=document.querySelector('#draft-form');document.querySelector('#draft-creator').onchange=e=>{const p=creators.find(p=>p.id===e.target.value);document.querySelector('#draft-name').value=p.name;document.querySelector('#draft-phone').value=p.phone};form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),c={id:'CT-PREVIEW-'+(contracts.length+1).toString().padStart(3,'0'),creator:f.get('creator'),template:f.get('template'),title:f.get('title'),legalName:f.get('legalName'),mobile:f.get('mobile'),amount:Number(f.get('amount')).toLocaleString('zh-CN',{minimumFractionDigits:2}),delivery:f.get('delivery'),deadline:f.get('deadline'),date:'刚刚（示例）',state:'DRAFT',archived:false};contracts.unshift(c);dialog.close();activeTab='ALL';query='';render();toast('示例草稿已保存，仅在当前页面有效')}}
function detail(c){const p=creators.find(p=>p.id===c.creator),t=templates.find(t=>t.id===c.template);openDialog('合同详情',`<div class="notice">以下是合成的示例合同，不代表真实签约或存证结果。</div><dl class="summary"><dt>合同编号</dt><dd>${c.id}</dd><dt>合同名称</dt><dd>${esc(c.title)}</dd><dt>使用模板</dt><dd>${esc(t?.name)}</dd><dt>签约创作者</dt><dd>${esc(c.legalName||p.name)}（示例）</dd><dt>合作金额</dt><dd>¥ ${esc(c.amount)}</dd><dt>签署截止</dt><dd>${esc(c.deadline)}</dd><dt>合同状态</dt><dd>${states[c.state][0]}</dd><dt>交付内容</dt><dd>${esc(c.delivery)}</dd></dl><h3>操作记录</h3><ul class="audit"><li><strong>创建合同草稿</strong><span>示例管理员 · ${esc(c.date)}</span></li>${c.state!=='DRAFT'?'<li><strong>确认发起签署</strong><span>预览状态示意</span></li>':''}${c.state==='SIGNED'?'<li><strong>双方签署完成</strong><span>预览状态示意</span></li>':''}</ul>`,button('查看合同示意','paper',c.id,true))}
function paper(c){const p=creators.find(p=>p.id===c.creator);openDialog('合同内容示意',`<div class="notice amber">这是用于说明布局的示意文档，不是原文件渲染，也不是具备法律效力的签署文件。</div><div class="paper"><h3>创作服务合作协议</h3><p>甲方：<span class="blank">示例公司</span></p><p>乙方：<span class="blank">${esc(c.legalName||p.name)}（示例）</span></p><p style="margin-top:20px">甲乙双方就创作服务事项达成如下示意约定：</p><p>一、合作内容<br>${esc(c.delivery)}</p><p>二、合作金额<br>人民币 <span class="blank">${esc(c.amount)}</span> 元。</p><p>三、交付与验收<br>按双方约定的交付范围和时间完成。</p><div class="signatures"><span>甲方签章：<br>［公司签章位置］</span><span>乙方签字：<br>［个人签名位置］</span></div><small>仅供界面预览 · 不构成任何实际合同</small></div>`,button('查看发起确认','launch',c.id,true),true)}
function launch(c){if(c.state!=='DRAFT'){toast('此示例合同已进入其他状态');return}const p=creators.find(p=>p.id===c.creator);openDialog('发起签署确认 · 预览',`<div class="notice amber">当前为独立界面预览，不会调用腾讯电子签、消耗合同份额或发送通知。</div><dl class="summary"><dt>合同名称</dt><dd>${esc(c.title)}</dd><dt>签约创作者</dt><dd>${esc(c.legalName||p.name)}（示例）</dd><dt>公司主体</dt><dd>示例公司</dd><dt>合作金额</dt><dd>¥ ${esc(c.amount)}</dd></dl><p class="muted" style="font-size:13px">正式系统中，管理员需要确认实名、填写内容和合同预览后再发起；合同内容随后固定。</p>`,`<button class="btn primary" data-action="simulate-launch" data-id="${c.id}">模拟进入签署中</button>`)}
function importTemplate(){openDialog('导入合同模板 · 预览',`<div class="notice">本页只保留选中文件的名称，不读取或上传文件内容；刷新后清空。</div><form id="import-form"><div class="field"><label for="import-name"><span class="required">*</span>模板名称</label><input class="input" id="import-name" name="name" required maxlength="100" placeholder="例如：编剧创作合作协议"></div><div class="field"><label for="import-file"><span class="required">*</span>模板原文件</label><input id="import-file" class="input" type="file" accept=".doc,.docx,.pdf" required><small>支持 Word、PDF，单个文件不超过 5MB。</small></div><p class="muted" style="font-size:12px">导入后还需配置填写字段和签章位置。Word 转换后的版式需要再次核对。</p></form>`,`<button class="btn primary" type="submit" form="import-form">体验导入</button>`);const f=document.querySelector('#import-file'),form=document.querySelector('#import-form');f.onchange=()=>{f.setCustomValidity('');const file=f.files[0];if(file&&(!/\.(docx?|pdf)$/i.test(file.name)||file.size>5*1024*1024))f.setCustomValidity('请选择 5MB 以内的 Word 或 PDF 文件');if(file&&!document.querySelector('#import-name').value)document.querySelector('#import-name').value=file.name.replace(/\.[^.]+$/,'')};form.onsubmit=e=>{e.preventDefault();const file=f.files[0];templates.unshift({id:'t-'+Date.now(),name:document.querySelector('#import-name').value,file:file.name,type:/\.pdf$/i.test(file.name)?'PDF':'Word',ready:false,date:'刚刚（示例）',fields:['合作金额','交付内容','交付日期']});dialog.close();render();toast('已添加示例模板记录；原文件未上传')}}
function configure(t){openDialog('配置模板 · 预览',`<div class="notice">正式系统会打开腾讯电子签模板编辑页。独立预览仅说明配置流程，不调用远端编辑服务。</div><div class="editor-placeholder">${icon('template')}<h3 style="margin:10px 0">腾讯电子签模板编辑页展示区域</h3><p class="muted" style="font-size:13px">${esc(t.name)}</p></div><ol style="padding-left:20px;line-height:2.2;font-size:13px"><li>核对 PDF 分页和字体。</li><li>依次配置公司与个人创作者两个签署方。</li><li>设置发起方填写字段、签字和盖章位置。</li><li>发布模板，返回平台关联模板编号。</li></ol>`,`<button class="btn primary" data-action="bind" data-id="${t.id}">查看关联步骤</button>`)}
function bind(t){openDialog('关联已发布模板 · 预览',`<div class="notice">这里模拟模板关联的界面反馈，不校验或提交真实腾讯模板编号。</div><p style="margin-bottom:20px;font-size:13px">模板：${esc(t.name)}</p><form id="bind-form"><div class="field"><label for="bind-id">电子签模板编号</label><input id="bind-id" class="input" value="EXAMPLE-TEMPLATE-ID" required maxlength="100"><small>正式系统会查询模板状态、签署角色和填写控件。</small></div></form>`,`<button class="btn primary" type="submit" form="bind-form">模拟关联并启用</button>`);document.querySelector('#bind-form').onsubmit=e=>{e.preventDefault();t.ready=true;dialog.close();render();toast('示例模板已启用；没有调用腾讯接口')}}
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){dialog.close();return}const el=e.target.closest('[data-action]');if(!el)return;const {action,id}=el.dataset,c=contracts.find(c=>c.id===id),t=templates.find(t=>t.id===id);switch(action){case'nav':navigate(id);break;case'creator':navigate('creator-'+id);break;case'tab':activeTab=id;render();break;case'reset':query='';render();break;case'draft':showDraft(id);break;case'detail':detail(c);break;case'paper':paper(c);break;case'launch':launch(c);break;case'simulate-launch':c.state='SIGNING';dialog.close();render();toast('已模拟签署中状态，不会发送合同');break;case'sign':openDialog('创作者签署入口 · 预览','<div class="notice">正式系统会生成对应创作者本人的腾讯小程序签署链接。预览不生成或发送真实链接。</div><p>签约人：'+esc(creators.find(p=>p.id===c.creator).name)+'（示例）</p>');break;case'sync':openDialog('同步合同状态 · 预览','<div class="notice">这里只体验状态更新后的界面，不查询真实签署状态。</div>',`<button class="btn primary" data-action="simulate-signed" data-id="${id}">模拟双方签署完成</button>`);break;case'simulate-signed':c.state='SIGNED';dialog.close();render();toast('示例状态已更新为已签署');break;case'archive':if(c.archived){openDialog('签署文件归档说明','<div class="notice">正式系统会下载腾讯签署完成的 PDF，经本平台权限校验后归档。本页没有真实合同文件可下载。</div>')}else{c.archived=true;render();toast('已模拟归档状态，没有下载或保存真实文件')}break;case'import':importTemplate();break;case'configure':configure(t);break;case'bind':bind(t);break;case'disable':t.ready=false;render();toast('已停用示例模板，历史示例合同仍保留');break;case'source':openDialog('模板原文件 · 预览','<div class="notice">此页面只展示文件名，不读取或上传原文件。正式系统会在权限校验后提供原文件下载。</div><p>'+esc(t.file)+'</p>');break;case'profile':openDialog('创作者档案 · 示例','<p>这里聚焦合同流程，点击「合同记录」可继续体验；正式系统保留完整的创作者资料。</p>');break}});
window.addEventListener('hashchange',()=>{query='';activeTab='ALL';render()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});render();
</script>
