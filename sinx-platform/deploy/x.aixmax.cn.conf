# Certificate and enterprise domain verification for x.aixmax.cn.
# Replace only the final location / blocks when the platform is deployed.
server {
    listen 80;
    listen [::]:80;
    server_name x.aixmax.cn;
    server_tokens off;
    root /var/www/sinx-platform/verification;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /WW_verify_vtwLRfnVCpw6BxoN.txt {
        default_type text/plain;
        add_header Cache-Control no-store always;
        try_files $uri =404;
    }

    location / {
        return 301 https://x.aixmax.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name x.aixmax.cn;
    server_tokens off;
    root /var/www/sinx-platform/verification;

    ssl_certificate /etc/letsencrypt/live/x.aixmax.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x.aixmax.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SINX_TLS:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;

    location = /WW_verify_vtwLRfnVCpw6BxoN.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    # The business application has not been deployed in this server setup step.
    location / {
        return 503;
    }
}
