# HTTP bootstrap for certificate issuance and enterprise domain verification.
# Keep the verification root separate from future application release directories.
server {
    listen 80;
    listen [::]:80;
    server_name x.aixmax.cn;
    server_tokens off;
    root /var/www/sinx-platform/verification;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /WW_verify_vtwLRfnVCpw6BxoN.txt {
        default_type text/plain;
        add_header Cache-Control no-store always;
        try_files $uri =404;
    }

    # Application deployment is separate; do not route into an existing service.
    location / {
        return 503;
    }
}
