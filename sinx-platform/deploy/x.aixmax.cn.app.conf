# Production entry for the independent SinX Platform service.
server {
    listen 80;
    listen [::]:80;
    server_name x.aixmax.cn;
    server_tokens off;
    root /var/www/sinx-platform/verification;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location = /WW_verify_vtwLRfnVCpw6BxoN.txt {
        default_type text/plain;
        add_header Cache-Control no-store always;
        try_files $uri =404;
    }
    location / { return 301 https://x.aixmax.cn$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name x.aixmax.cn;
    server_tokens off;
    root /var/www/sinx-platform/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/x.aixmax.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x.aixmax.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SINX_TLS:10m;
    ssl_session_timeout 1d;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    client_max_body_size 1m;

    location = /WW_verify_vtwLRfnVCpw6BxoN.txt {
        root /var/www/sinx-platform/verification;
        default_type text/plain;
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18088;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # OAuth callback query contains a one-time code.
        access_log off;
    }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
